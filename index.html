  <!-- ===== Attrape-erreurs de secours ===== 
       Sans bundler ni outils de dev sur téléphone, un écran blanc ne dit rien sur la
       cause. Ce script (le tout premier à s'exécuter) affiche quelque chose à l'écran
       plutôt que rien du tout quand une erreur JS empêche l'app de démarrer.
       Cas particulier traité proprement : l'app charge React/Firebase/Tailwind/etc depuis
       Internet à chaque démarrage (rien n'est intégré dans l'app), si le téléphone n'a
       aucune connexion pile à ce moment, ces bibliothèques ne se chargent pas du tout et
       une variable comme "React" ou "firebase" est alors "not defined". Dans ce cas précis
       (repérable via ce message d'erreur), on affiche un écran clair "pas de connexion" avec
       un bouton réessayer, plutôt que le détail technique en rouge, réservé aux vraies
       erreurs de code, plus utiles à moi (Claude) qu'à l'utilisateur. -->
  <script>
    window.addEventListener("error", function (e) {
      var estBibliothequeManquante = /\b(React|ReactDOM|firebase|L|katex|marked|emailjs|Tone) is not defined/.test(e.message || "");
      var pre = document.createElement("div");
      if (estBibliothequeManquante) {
        pre.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#131313;color:#f6f3ec;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:sans-serif;gap:14px;";
        pre.innerHTML =
          '<div style="font-size:15px;font-weight:600;">Pas de connexion internet</div>' +
          '<div style="font-size:13px;color:#a8a29a;max-width:280px;line-height:1.5;">Sabi a besoin d\'internet au moins une fois pour se charger. Connecte-toi puis réessaie.</div>' +
          '<button id="sabi-reessayer" style="margin-top:8px;padding:10px 24px;border-radius:999px;background:#f2ca50;color:#131313;font-weight:600;border:none;font-size:14px;">Réessayer</button>';
      } else {
        pre.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#1a0000;color:#ff6b6b;padding:16px;font-size:12px;white-space:pre-wrap;overflow:auto;margin:0;font-family:monospace;";
        pre.textContent = "Erreur JS au chargement :\n\n" + e.message + "\n\nFichier : " + e.filename + "\nLigne : " + e.lineno + ", colonne : " + e.colno + (e.error && e.error.stack ? "\n\nDétail :\n" + e.error.stack : "");
      }
      document.body.appendChild(pre);
      var btn = document.getElementById("sabi-reessayer");
      if (btn) btn.addEventListener("click", function () { window.location.reload(); });
    });
  </script>

  <!-- Préconnexions : négocie DNS/TLS avec ces domaines en avance, pendant que le reste de la
       page se charge, réduit le temps d'attente réel avant que chaque script démarre.
       Aucun changement de comportement, juste plus rapide. -->

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

  <script>
    // Mode léger : sur un téléphone à 2 Go de RAM (ou moins), on retire seulement le flou de verre
    // (le plus gourmand). Réglage manuel : localStorage.setItem("sabi_effets", "on" | "off").
    (function () {
      try {
        var pref = localStorage.getItem("sabi_effets");
        var leger = pref === "off" || (pref !== "on" && navigator.deviceMemory && navigator.deviceMemory <= 2);
        if (leger) document.documentElement.classList.add("sabi-lite");
      } catch (e) {}
    })();
  </script>

<body>
  <div id="root"></div>

  <!-- Application React (Vite) : tout le code est dans src/ -->
  <script type="module" src="/src/main.js"></script>

  <script>
    // Enregistre le service worker (PWA) — silencieux en cas d'échec, l'app reste
    // utilisable normalement même si le navigateur ne le supporte pas.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          // Background Sync : redéclenché à chaque retour réseau (best-effort, voir sw.js).
          if ("sync" in reg) {
            window.addEventListener("online", () => reg.sync.register("sabi-sync").catch(() => {}));
          }
          // Periodic Background Sync : nécessite en plus une permission explicite, accordée par
          // Chrome seulement pour une PWA installée avec un usage régulier (jamais garanti).
          if ("periodicSync" in reg) {
            navigator.permissions.query({ name: "periodic-background-sync" }).then((status) => {
              if (status.state === "granted") {
                reg.periodicSync.register("sabi-rappels-epreuves", { minInterval: 12 * 60 * 60 * 1000 }).catch(() => {});
              }
            }).catch(() => {});
          }
        }).catch(() => {});
      });
    }
  </script>

  <!-- ===== Protection anti-capture / anti-fuite (best-effort) =====
       Une vraie capture d'écran (touche du téléphone/PC) ne peut techniquement
       pas être bloquée ni détectée par un site web, quel qu'il soit. Ce bloc fait
       deux choses réalistes : (1) noircit l'écran dès que l'app perd le focus,
       ce qui bloque la plupart des logiciels d'enregistrement d'écran et les
       captures via changement d'onglet/app ; (2) appose un filigrane discret
       avec l'identité de l'étudiant connecté, pour dissuader et tracer une
       fuite si une capture "physique" (photo d'écran) échappe malgré tout. -->
  
  <div id="sabi-shield"></div>
  <div id="sabi-watermark"></div>
  <script>
    (function () {
      var shield = document.getElementById("sabi-shield");
      function activer() { shield.classList.add("actif"); }
      function desactiver() { shield.classList.remove("actif"); }
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) activer(); else desactiver();
      });
      window.addEventListener("blur", activer);
      window.addEventListener("focus", desactiver);

      // Limite la copie facile (n'empêche pas une capture physique de l'écran).
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("dragstart", function (e) { e.preventDefault(); });

      // Filigrane traçable : identité de l'étudiant connecté (email Firebase Auth),
      // répétée en discret sur les onglets Épreuves et Résumés (contenu sensible aux
      // fuites : sujets, corrigés, résumés de cours). Reste permanent mais léger — pas
      // de mode "saturé" : impossible de détecter une capture d'écran physique depuis
      // un site web, donc pas de sens à réserver l'effet à ce moment précis (voir
      // discussion). Invisible sur les autres onglets.
      function poserFiligrane(texte) {
        var wm = document.getElementById("sabi-watermark");
        if (!wm) return;
        texte = texte || window.__sabiFiligraneTexte || "Sabi";
        var onglet = window.__sabiTabActif;
        var actif = onglet === "epreuves" || onglet === "resumes";
        wm.style.opacity = actif ? "0.05" : "0";
        if (!actif) { wm.innerHTML = ""; return; }
        var html = "";
        for (var y = 0; y < 10; y++) {
          for (var x = 0; x < 5; x++) {
            html += '<span style="top:' + (y * 130) + 'px; left:' + (x * 240 - 80) + 'px;">' + texte + "</span>";
          }
        }
        wm.innerHTML = html;
      }
      poserFiligrane();
      window.__sabiActualiserFiligrane = poserFiligrane;
      window.addEventListener("resize", function () { poserFiligrane(window.__sabiFiligraneTexte); });

      // Se raccroche à Firebase Auth (déjà initialisé plus haut dans la page)
      // pour afficher l'email de l'étudiant connecté dans le filigrane.
      function connecterAuFirebaseAuth() {
        if (window.firebase && firebase.apps && firebase.apps.length && firebase.auth) {
          firebase.auth().onAuthStateChanged(function (user) {
            var texte = (user && (user.email || user.uid)) || "Sabi";
            window.__sabiFiligraneTexte = texte;
            poserFiligrane(texte);
          });
        } else {
          setTimeout(connecterAuFirebaseAuth, 500);
        }
      }
      connecterAuFirebaseAuth();
    })();
  </script>
