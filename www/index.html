<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Sabi — Ensemble pour la réussite de chaque étudiant de l'IUT FV</title>

  <!-- ===== Attrape-erreurs de secours ===== 
       Sans bundler ni outils de dev sur téléphone, un écran blanc ne dit rien sur la
       cause. Ce script (le tout premier à s'exécuter) affiche quelque chose à l'écran
       plutôt que rien du tout quand une erreur JS empêche l'app de démarrer.
       Cas particulier traité proprement : l'app charge React/Firebase/Tailwind/etc depuis
       Internet à chaque démarrage (rien n'est intégré dans l'app) — si le téléphone n'a
       aucune connexion pile à ce moment, ces bibliothèques ne se chargent pas du tout et
       une variable comme "React" ou "firebase" est alors "not defined". Dans ce cas précis
       (repérable via ce message d'erreur), on affiche un écran clair "pas de connexion" avec
       un bouton réessayer, plutôt que le détail technique en rouge — réservé aux vraies
       erreurs de code, plus utiles à moi (Claude) qu'à l'utilisateur. -->
  <script>
    window.addEventListener("error", function (e) {
      var estBibliothequeManquante = /^[A-Za-z_$][\w$]* is not defined$/.test(e.message || "")
        && ["React", "ReactDOM", "firebase", "L", "katex", "marked", "emailjs", "Tone"].some(
          nom => (e.message || "").indexOf(nom + " is not defined") === 0
        );
      var pre = document.createElement("div");
      if (estBibliothequeManquante) {
        pre.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#131313;color:#f6f3ec;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:sans-serif;gap:14px;";
        pre.innerHTML =
          '<div style="font-size:15px;font-weight:600;">Pas de connexion internet</div>' +
          '<div style="font-size:13px;color:#a8a29a;max-width:280px;line-height:1.5;">Sabi a besoin d\'internet au moins une fois pour se charger. Connecte-toi puis réessaie.</div>' +
          '<button id="sabi-reessayer" style="margin-top:8px;padding:10px 24px;border-radius:999px;background:#f2ca50;color:#131313;font-weight:600;border:none;font-size:14px;">Réessayer</button>';
      } else {
        pre.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:#1a0000;color:#ff6b6b;padding:16px;font-size:12px;white-space:pre-wrap;overflow:auto;margin:0;font-family:monospace;";
        pre.textContent = "Erreur JS au chargement :\n\n" + e.message + "\n\nFichier : " + e.filename + "\nLigne : " + e.lineno + ", colonne : " + e.colno + (e.error && e.error.stack ? "\n\nDétail :\n" + e.error.stack : "");
      }
      document.body.appendChild(pre);
      var btn = document.getElementById("sabi-reessayer");
      if (btn) btn.addEventListener("click", function () { window.location.reload(); });
    });
  </script>

  <!-- Préconnexions : négocie DNS/TLS avec ces domaines en avance, pendant que le reste de la
       page se charge — réduit le temps d'attente réel avant que chaque script démarre.
       Aucun changement de comportement, juste plus rapide. -->

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    // Câble les polices importées dans les utilitaires Tailwind (font-sans / font-mono)
    // — sans ça, les imports Google Fonts ci-dessus ne servent à rien.
    // Charte "Academic Excellence" : plus de serif (Fraunces) — tout en Inter, mono en JetBrains Mono.
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ["'JetBrains Mono'", "ui-monospace", "monospace"],
          },
        },
      },
    };
  </script>
  <!-- Firebase (version compat = plus simple, pas besoin de "import") -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root {
      /* ===== Système de couleur Sabi — charte "Academic Excellence" ===== */
      --bg: #131313;
      --surface: #1c1b1b;
      --surface-2: #201f1f;
      --border: #4d4635;      /* outline-variant */
      --border-strong: #99907c; /* outline */
      --text: #e5e2e1;        /* on-surface */
      --text-muted: #d0c5af;  /* on-surface-variant */
      --text-faint: #99907c;  /* outline — passe AA (5.9:1) même en texte normal */
      --text-ghost: #4d4635;  /* outline-variant — décoratif/désactivé uniquement */
      --gold: #f2ca50;        /* primary — savoir, valeur, accent principal */
      --gold-ink: #3c2f00;    /* on-primary — texte sur fond doré */
      --gold-soft: rgba(242,202,80,0.12);
      --forest: #77dd6a;      /* secondary — croissance, validation, positif */
      --forest-soft: rgba(119,221,106,0.12);
      --forest-text: #77dd6a; /* déjà 10.9:1 sur le fond — pas besoin d'une variante éclaircie séparée */
      --terra: #ffb4ab;       /* error — alerte, urgence, suppression */
      --terra-soft: rgba(255,180,171,0.12);
      --terra-text: #ffb4ab;  /* déjà 10.9:1 sur le fond — pas besoin d'une variante éclaircie séparée */
      --tertiary: #ffc19e;    /* earth brown — décoratif, non branché sur un usage précis pour l'instant */
    }
    body, html { margin: 0; padding: 0; background: var(--bg); overflow-x: hidden; max-width: 100vw; overscroll-behavior-y: contain; }

    /* ===== Passe de style épurée : profondeur discrète, transitions fluides, détails soignés ===== */
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      background:
        radial-gradient(ellipse 900px 500px at 15% -5%, rgba(242,202,80,0.05), transparent 60%),
        radial-gradient(ellipse 700px 500px at 100% 10%, rgba(119,221,106,0.05), transparent 55%),
        var(--bg);
      background-attachment: fixed;
    }
    ::selection { background: rgba(242,202,80,0.35); color: var(--text); }
    *:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

    /* Motif signature : un fin filet à trois tons (or / vert / terre) — rappelle un tissage
       traditionnel, réutilisé comme séparateur de section pour donner à Sabi une identité
       qu'on ne retrouve dans aucun autre site étudiant */
    .kente-rule {
      height: 3px;
      background: linear-gradient(90deg, var(--gold) 0 33%, var(--forest) 33% 66%, var(--terra) 66% 100%);
      opacity: 0.55;
      border: none;
    }

    /* Toute carte/panneau "rounded-xl border" du projet reçoit automatiquement une légère
       élévation et une transition douce — un seul point de contrôle pour tout l'app */
    .rounded-xl.border {
      border-radius: 16px !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 28px -14px rgba(0,0,0,0.55);
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      position: relative;
    }
    /* Fin liseré doré en haut de chaque carte — signature discrète, cohérente avec le kente-rule */
    .rounded-xl.border::before {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(242,202,80,0.35), transparent);
      pointer-events: none;
    }
    /* Formes plus "sculptées" pour les grands conteneurs (modales, blocs de mise en avant) */
    .rounded-2xl { border-radius: 20px !important; }

    /* Écrin circulaire du blason Sabi — remplace le logo "flottant" par un sceau bien ancré,
       cohérent avec l'identité graduation cap / S manuscrit du logo fourni */
    .sabi-emblem {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 30%, rgba(242,202,80,0.16), rgba(242,202,80,0.02) 70%), var(--surface-2);
      border: 1px solid rgba(242,202,80,0.35);
      box-shadow: 0 0 0 1px rgba(242,202,80,0.08), 0 10px 24px -10px rgba(0,0,0,0.6);
    }
    .sabi-emblem img { border-radius: 999px; }

    /* Boutons pleins dorés — un léger dégradé + reflet du haut au lieu d'un aplat plat */
    .sabi-btn-gold {
      background: linear-gradient(180deg, #F5D87E 0%, var(--gold) 55%, #F0C133 100%) !important;
      box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 8px 20px -8px rgba(242,202,80,0.55);
      border-radius: 14px !important;
    }
    .sabi-btn-gold:active { box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 4px 10px -6px rgba(242,202,80,0.4); }

    /* Bouton flottant (FAB) : "squircle" au lieu d'un cercle plat — silhouette plus travaillée */
    .sabi-fab {
      border-radius: 30% !important;
      background: linear-gradient(155deg, #F5D87E 0%, var(--gold) 55%, #F0C133 100%) !important;
      box-shadow: 0 1px 0 rgba(255,255,255,0.3) inset, 0 10px 26px -8px rgba(242,202,80,0.55) !important;
    }

    /* Barre de navigation basse : légèrement détachée du contenu, coins hauts adoucis,
       comme un dock qui flotte doucement au-dessus du bas de l'écran */
    .sabi-nav {
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      box-shadow: 0 -12px 28px -18px rgba(0,0,0,0.6);
    }
    /* Chip actif d'un onglet — enveloppe icône + libellé plutôt qu'un simple soulignement */
    .sabi-nav-chip {
      border-radius: 14px;
      transition: background-color 200ms ease, box-shadow 200ms ease;
    }

    /* --- Dynamisme du header --- */
    .sabi-header { background-color: var(--bg); }
    .sabi-header-glow {
      position: absolute; inset: -40% -20%;
      background:
        radial-gradient(circle at 20% 20%, rgba(242,202,80,0.16), transparent 55%),
        radial-gradient(circle at 85% 75%, rgba(119,221,106,0.20), transparent 55%);
      animation: sabi-glow-drift 10s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes sabi-glow-drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, -4%) scale(1.08); }
    }
    /* Anneau du blason : légère pulsation continue, comme un sceau vivant */
    .sabi-emblem-pulse { animation: sabi-emblem-pulse 3.2s ease-in-out infinite; }
    @keyframes sabi-emblem-pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(242,202,80,0.08), 0 10px 24px -10px rgba(0,0,0,0.6); }
      50%      { box-shadow: 0 0 0 5px rgba(242,202,80,0.10), 0 10px 24px -10px rgba(0,0,0,0.6); }
    }
    /* Filet tricolore : un reflet lumineux le traverse lentement en boucle */
    .kente-rule-shimmer { position: relative; overflow: hidden; }
    .kente-rule-shimmer::after {
      content: "";
      position: absolute; top: 0; bottom: 0; left: -30%;
      width: 30%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
      animation: sabi-shimmer-sweep 3.5s linear infinite;
    }
    @keyframes sabi-shimmer-sweep {
      0%   { left: -30%; }
      100% { left: 130%; }
    }

    button { transition: transform 120ms ease, opacity 150ms ease, background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease; }
    button:active { transform: scale(0.94); }
    input, textarea, select { transition: border-color 150ms ease, box-shadow 150ms ease; }
    input:focus, textarea:focus, select:focus { border-color: var(--gold) !important; box-shadow: 0 0 0 3px var(--gold-soft); }

    /* Barres de défilement discrètes (fil filière, épreuves...) */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

    @media (prefers-reduced-motion: reduce) {
      *, button, input, textarea, select { transition: none !important; animation: none !important; }
    }

    /* Glissement (swipe) entre onglets adjacents — l'onglet entrant arrive du côté vers lequel on a poussé. */
    @keyframes sabi-slide-from-right {
      0%   { transform: translateX(36px); opacity: 0.3; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes sabi-slide-from-left {
      0%   { transform: translateX(-36px); opacity: 0.3; }
      100% { transform: translateX(0); opacity: 1; }
    }
    .sabi-swipe-in-left { animation: sabi-slide-from-right 260ms cubic-bezier(0.22, 0.61, 0.36, 1); }
    .sabi-swipe-in-right { animation: sabi-slide-from-left 260ms cubic-bezier(0.22, 0.61, 0.36, 1); }
    @keyframes sabi-fade-up {
      0%   { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .sabi-tab-fade { animation: sabi-fade-up 280ms cubic-bezier(0.22, 0.61, 0.36, 1); }

    /* Révélation en cascade : chaque enfant direct apparaît un peu après le précédent, au lieu
       que toute une liste surgisse d'un bloc — c'est ça qui donne l'impression de vie sur les
       écrans à listes (fil, épreuves, chat, classement...). Un seul className à poser sur le
       conteneur, tout le reste est automatique en CSS pur. */
    .sabi-liste-animee > * {
      animation: sabi-fade-up 420ms cubic-bezier(0.22, 0.61, 0.36, 1) backwards;
    }
    .sabi-liste-animee > *:nth-child(1) { animation-delay: 0ms; }
    .sabi-liste-animee > *:nth-child(2) { animation-delay: 40ms; }
    .sabi-liste-animee > *:nth-child(3) { animation-delay: 80ms; }
    .sabi-liste-animee > *:nth-child(4) { animation-delay: 120ms; }
    .sabi-liste-animee > *:nth-child(5) { animation-delay: 160ms; }
    .sabi-liste-animee > *:nth-child(6) { animation-delay: 200ms; }
    .sabi-liste-animee > *:nth-child(n+7) { animation-delay: 220ms; }

    /* Retour tactile plus vivant sur les cartes/lignes cliquables (pas seulement les boutons). */
    .sabi-carte-interactive { transition: transform 150ms ease, box-shadow 150ms ease; }
    .sabi-carte-interactive:active { transform: scale(0.98); }

    /* Toast (points gagnés, confirmations...) */
    @keyframes sabi-toast-in {
      0%   { opacity: 0; transform: translate(-50%, -12px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes sabi-toast-out {
      0%   { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -12px); }
    }
    .sabi-toast { animation: sabi-toast-in 200ms ease; }
    .sabi-toast.sabi-toast-leaving { animation: sabi-toast-out 200ms ease forwards; }

    /* Silhouettes de chargement (skeleton) */
    @keyframes sabi-skeleton-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .sabi-skeleton { animation: sabi-skeleton-pulse 1.3s ease-in-out infinite; border-radius: 10px; }

    /* Rendu des corrigés (Markdown converti en HTML par marked.js + formules par KaTeX) */
    .corrige-rendu { line-height: 1.55; }
    .corrige-rendu h1, .corrige-rendu h2, .corrige-rendu h3, .corrige-rendu h4 { font-weight: 700; color: #e5e2e1; margin: 0.9em 0 0.35em; }
    .corrige-rendu h1 { font-size: 1.15rem; }
    .corrige-rendu h2 { font-size: 1.08rem; }
    .corrige-rendu h3, .corrige-rendu h4 { font-size: 1rem; }
    .corrige-rendu p { margin: 0.5em 0; }
    .corrige-rendu strong { color: #e5e2e1; font-weight: 700; }
    .corrige-rendu em { color: #f2ca50; font-style: italic; }
    .corrige-rendu ul, .corrige-rendu ol { margin: 0.4em 0 0.6em 1.25em; }
    .corrige-rendu ul { list-style: disc; }
    .corrige-rendu ol { list-style: decimal; }
    .corrige-rendu li { margin: 0.2em 0; }
    .corrige-rendu code { background: rgba(242,202,80,0.12); color: #f2ca50; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.85em; }
    .corrige-rendu pre { background: #1c1b1b; border: 1px solid #4d4635; border-radius: 8px; padding: 0.6em 0.8em; overflow-x: auto; margin: 0.5em 0; }
    .corrige-rendu pre code { background: none; padding: 0; }
    .corrige-rendu hr { border: none; border-top: 1px solid #4d4635; margin: 1em 0; }
    .corrige-rendu blockquote { border-left: 3px solid #f2ca50; padding-left: 0.75em; color: #d0c5af; margin: 0.5em 0; }
    .corrige-rendu, .corrige-rendu * { color: #e5e2e1 !important; }
    .corrige-rendu strong { color: #e5e2e1 !important; font-weight: 700; }
    .corrige-rendu em { color: #f2ca50 !important; font-style: italic; }
    .corrige-rendu code { color: #f2ca50 !important; }
    .corrige-rendu .katex { font-size: 1em; }
    .corrige-rendu .katex-display { overflow-x: auto; overflow-y: hidden; margin: 0.6em 0; }
    .corrige-rendu .katex .frac-line, .corrige-rendu .katex .rule { border-color: #e5e2e1 !important; background: #e5e2e1 !important; }
  </style>

<body>
  <div id="root"></div>

  <script>
    // ========== THÈME — reflète les variables CSS de :root ==========
    // Un seul endroit à modifier pour changer une couleur dans toute l'app
    // (avant : chaque composant réécrivait le hex en dur, des centaines de fois).
    const COLORS = {
      bg: "#131313",
      surface: "#1c1b1b",
      surface2: "#201f1f",
      border: "#4d4635",
      borderStrong: "#99907c",
      text: "#e5e2e1",
      textMuted: "#d0c5af",
      textFaint: "#99907c",
      textGhost: "#4d4635",
      gold: "#f2ca50",
      goldInk: "#131313",
      forest: "#77dd6a",
      terra: "#ffb4ab",
      // Variantes éclaircies, réservées au TEXTE (labels, montants, messages d'erreur).
      // forest/terra d'origine restent utilisées pour bordures, fonds et éléments graphiques
      // (jauges, icônes) où le seuil WCAG est 3:1 — elles le passent déjà.
      // forestText/terraText visent 4.5:1 (texte normal) sur --bg et --surface.
      forestText: "#77dd6a",
      terraText: "#ffb4ab",
    };

    // ===== Thème clair / sombre =====
    // COLORS est un objet muté en place (plutôt que remplacé) : comme tous les composants lisent
    // COLORS.xxx au moment du rendu (et non une valeur figée à l'import), il suffit de réécrire ses
    // propriétés puis de forcer un re-rendu de l'app (voir themeVersion dans App) pour que tout
    // l'habillage change instantanément, sans avoir à faire transiter un thème en props partout.
    const THEME_SOMBRE = { ...COLORS };
    const THEME_CLAIR = {
      bg: "#f6f3ec",
      surface: "#ffffff",
      surface2: "#efebe0",
      border: "#d9d0ba",
      borderStrong: "#a89a78",
      text: "#221f19",
      textMuted: "#5a5140",
      textFaint: "#867a61",
      textGhost: "#d9d0ba",
      gold: "#b8860f",
      goldInk: "#fffaf0",
      forest: "#1f8a3b",
      terra: "#c23b32",
      forestText: "#1a7a33",
      terraText: "#b7362d",
    };
    let themeActuel = "sombre";
    try { themeActuel = localStorage.getItem("sabi_theme") === "clair" ? "clair" : "sombre"; } catch {}
    function appliquerTheme(mode) {
      Object.assign(COLORS, mode === "clair" ? THEME_CLAIR : THEME_SOMBRE);

    const LIMITE_FICHIER_IA = 4 * 1024 * 1024;

    // redimensionnée à 1600px de large max et recompressée en JPEG qualité 0.75, elle reste
    // largement lisible pour l'IA tout en tenant confortablement sous le seuil.
    async function redimensionnerImagePourIA(blob) {
      const bitmap = await createImageBitmap(blob).catch(() => null);
      if (!bitmap) return blob; // navigateur sans support createImageBitmap : tenté tel quel
      const LARGEUR_MAX = 1600;
      const ratio = Math.min(1, LARGEUR_MAX / bitmap.width);
      const largeur = Math.round(bitmap.width * ratio);
      const hauteur = Math.round(bitmap.height * ratio);
      const canvas = document.createElement("canvas");
      canvas.width = largeur; canvas.height = hauteur;
      canvas.getContext("2d").drawImage(bitmap, 0, 0, largeur, hauteur);
      const recompresse = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.75));
      return recompresse || blob;
    }

    async function partieGeminiPourFichier(url, mimeTypePdf) {

    async function fetchGeminiAvecRetry(url, body, timeoutMs, tentatives) {

          return await genererViaRepliChat(mode, prompt, base64Repli, mimeTypeRepli, "sujet.pdf", "Sabi - Corrige IA");
        } catch (errRepli) {
          throw new Error("Gemini, Groq et OpenRouter sont tous indisponibles pour le moment. Réessaie dans quelques minutes. (" + errRepli.message + ")");
        }
      }
    }

    // Génère un résumé de cours (fiche de révision) à partir d'un contenu déjà saisi et/ou
    // d'un PDF joint — même mécanique que genererCorrigeIA (cache Firebase, quota préservé).
    // Appelle Gemini avec des `parts` déjà prêtes (texte + éventuel PDF/image inline) et renvoie
    // le texte généré. Factorisé pour être réutilisé par corrigé et résumé.
    // Un seul appel à Gemini, sans gestion de la coupure — utilisé en interne par
    // genererViaGeminiParts ci-dessous (boucle de reprise automatique).
    async function appellerGeminiUneFois(contenus) {
      let response;
      try {
        response = await fetchGeminiAvecRetry(GEMINI_URL, {
          contents: contenus,
          // maxOutputTokens à 8192 coupait net les sujets à plusieurs exercices avant la fin
          // (d'où l'impression d'exercices "sautés" ou de pages ignorées — en réalité Gemini
          // n'avait simplement plus de budget pour continuer). thinkingLevel "medium" (au lieu
          // de "low") pousse aussi à traiter chaque exercice plus rigoureusement plutôt que
          // superficiellement pour tenir dans un budget serré.
          generationConfig: { thinkingConfig: { thinkingLevel: "medium" }, maxOutputTokens: 100000 }
        }, 90000);
      } catch (err) {
        if (err.name === "AbortError") throw new Error("L'IA a mis trop de temps à répondre. Réessaie.");
        throw new Error("Impossible de contacter l'IA — vérifie ta connexion.");
      }
      if (!response.ok) {
        const errData = await response.json().catch(() => null);
        const surchargee = response.status === 503 || response.status === 429;
        throw new Error(surchargee
          ? "Gemini est très sollicité en ce moment."
          : (errData?.error?.message || ("Erreur HTTP " + response.status)));
      }
      const data = await response.json();
      const candidat = data?.candidates?.[0];
      const texte = candidat?.content?.parts?.[0]?.text;
      if (!texte) throw new Error("Réponse vide de l'IA.");
      return { texte, coupe: candidat?.finishReason === "MAX_TOKENS" };
    }

    // Flag de reprise : si la réponse s'arrête pile à la limite de tokens (sujet à beaucoup
    // d'exercices, fiche de révision très détaillée...), on relance automatiquement en renvoyant
    // tout l'historique (question d'origine + réponse partielle déjà reçue) et en demandant à
    // Gemini de reprendre exactement où il s'était arrêté, plutôt que d'infliger un corrigé
    // tronqué à l'utilisateur. Plafonné à 2 relances (3 appels au total) pour éviter une boucle
    // sans fin si le modèle n'arrive jamais à conclure.
    async function genererViaGeminiParts(parts, nomPourErreurs) {
      let contenus = [{ role: "user", parts }];
      let texteComplet = "";
      const MAX_RELANCES = 2;

      for (let relance = 0; relance <= MAX_RELANCES; relance++) {
        const { texte, coupe } = await appellerGeminiUneFois(contenus);
        texteComplet += texte;

        if (!coupe) return texteComplet.trim();
        if (relance === MAX_RELANCES) {
          return texteComplet.trim() +
            "\n\n---\n*⚠️ Le " + nomPourErreurs + " a été coupé même après plusieurs relances automatiques — relance la génération, ou demande la suite manuellement.*";
        }

        // Derniers mots de la réponse partielle, pour ancrer précisément la reprise.
        const derniersMots = texte.trim().split(/\s+/).slice(-8).join(" ");
        contenus = [
          ...contenus,
          { role: "model", parts: [{ text: texte }] },
          { role: "user", parts: [{ text: "Continue exactement à partir de : « " + derniersMots + " ». Ne répète rien de ce qui précède, enchaîne directement la suite sans réintroduction ni résumé de ce qui a déjà été dit." }] }
        ];
      }
    }

    // Quand Gemini est indisponible/surchargé, Groq puis OpenRouter prennent le relais :
    // - mode "texte" : Groq d'abord (le plus rapide), puis OpenRouter si Groq échoue aussi.
    // - mode "pdf"/"photo" : directement OpenRouter (type de contenu "file"/"image_url"), car le
    //   modèle configuré sur Groq (openai/gpt-oss-120b) ne lit ni PDF ni image.
    async function genererViaRepliChat(mode, prompt, base64, mimeType, nomFichierPdf, titrePourEnTete) {
      const entetesOpenRouter = { "HTTP-Referer": window.location.origin, "X-Title": titrePourEnTete };

      if (mode === "texte") {
        const messages = [{ role: "user", content: prompt }];
        try {
          return await appellerChatIA("groq", GROQ_MODEL, messages);
        } catch (errGroq) {
          try {
            return await appellerChatIA("openrouter", OPENROUTER_MODEL, messages, entetesOpenRouter);
          } catch (errOR) {
            try {
              return await appellerChatIA("huggingface", HUGGINGFACE_MODEL, messages);
            } catch (errHF) {
              return await appellerChatIA("openai", OPENAI_MODEL, messages);
            }
          }
        }
      }

      // mode "pdf"/"photo" : uniquement OpenRouter, seul fournisseur du groupe dont on sait que le
      // format d'envoi de fichier ci-dessous (type "file"/"image_url" inline en base64) est bien
      // supporté par le modèle configuré. Étendre à Hugging Face/OpenAI demanderait de vérifier
      // leur format d'entrée fichier/image respectif avant de brancher à l'aveugle.

      if (mode === "pdf") {
        const messages = [{
          role: "user",
          content: [
            { type: "text", text: prompt },
            { type: "file", file: { filename: nomFichierPdf, file_data: "data:application/pdf;base64," + base64 } }
          ]
        }];
        return await appellerChatIA("openrouter", OPENROUTER_MODEL, messages, entetesOpenRouter);
      }

      // mode === "photo"
      const messages = [{
        role: "user",
        content: [
          { type: "text", text: prompt },
          { type: "image_url", image_url: { url: "data:" + mimeType + ";base64," + base64 } }
        ]
      }];
      return await appellerChatIA("openrouter", OPENROUTER_MODEL, messages, entetesOpenRouter);
    }

    async function genererResumeIA(contenuTexte, matiere, pdfUrl) {
      const texteSuffisant = (contenuTexte || "").trim().length >= 50;
      const parts = [];

      const consigne = "Rédige une fiche de révision claire, structurée (titres, sous-titres, puces), " +
        "qui synthétise les notions clés à retenir, les définitions importantes et les points souvent " +
        "demandés en examen. Pour les formules mathématiques, utilise du LaTeX valide entre $ ou $$ " +

        "politesse ni d'introduction inutile, va directement à la fiche.";

      if (texteSuffisant) {

    // ========== GROQ & OPENROUTER (Mentor / Diagnostic IA) ==========

    async function appellerChatIA(provider, model, messages, extraHeaders) {
      const controller = new AbortController();

      if (!response.ok) {
        const errData = await response.json().catch(() => null);

      const data = await response.json();

    async function appellerOpenRouter(messages) {

    const MENTOR_SYSTEM_PROMPT = "Tu es le Coach Réussite de Sabi, un mentor académique pour les étudiants de " +

    // Analyse la photo d'une feuille de notes affichée au babillard : détecte la matière et

            generationConfig: {

              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",

    const { useState, useEffect, useCallback } = React;

    // ========== HOOK useFirebaseList ==========
    // Écoute un nœud Firebase "à plat" (ref/{id}: {...champs}) en temps réel et le
    // transforme en tableau [{id, ...champs}, ...] dans un état React, avec nettoyage
    // automatique de l'écoute au démontage. Remplace ~8 blocs quasi-identiques dans ce
    // fichier — un seul endroit à corriger si jamais il y a un bug, au lieu de huit.
    //
    // Usage : const cards = useFirebaseList(cardsRef, { actif: !!authUser });
    //   - ref : référence Firebase (peut être construite dynamiquement, ex: epreuvesRef.child(x))
    //   - options.actif : n'écoute que si true (évite de lire avant d'être connecté)
    //   - options.limit : ne garde que les N derniers éléments (ex: chat, journal de points)
    //   - options.onError : callback optionnel en cas de PERMISSION_DENIED ou autre erreur
    function useFirebaseList(ref, options = {}) {
      const { actif = true, limit = null, onError = null } = options;
      const [liste, setListe] = useState([]);

      useEffect(() => {
        if (!ref || !actif) { setListe([]); return; }
        const cible = limit ? ref.limitToLast(limit) : ref;
        const listener = cible.on("value", snapshot => {
          const data = snapshot.val() || {};
          setListe(Object.keys(data).map(id => ({ id, ...data[id] })));
        }, err => {
          if (onError) onError(err);
          else console.error("useFirebaseList:", err.message);
        });
        return () => cible.off("value", listener);
        // eslint-disable-next-line
      }, [ref && ref.toString(), actif, limit]);

      return liste;
    }

    // ========== DONNÉES DE RÉFÉRENCE ==========
    const FILIERES_BASE = [

    ];

    // de filières quelle que soit l'année désormais, plus de distinction par niveau.
    function getFilieresPourAnnee(annee) {

    // Liste de repli utilisée là où le niveau n'est pas connu (filtres globaux, etc.)
    const FILIERES = FILIERES_BASE;

    // Référentiel des UE/cours par filière — sert à : pré-remplir le Simulateur avec les vraies UE,

    // Génie Électrique, Année 1 : construit à partir du relevé de programme fourni par un étudiant.

    const CURRICULUM = {

    // (les sous-cours avec leur code officiel, ex: ANA1111 -> Analyse I) — sert à l'accès
    // rapide par matière dans l'onglet Épreuves : on choisit un code, on tombe directement
    // sur le PDF du sujet. Tant que le programme d'une filière n'est pas encore renseigné
    // dans CURRICULUM, la liste est simplement vide (pas d'erreur).
    function matieresFilantes(filiere, annee, semestre) {
      const ues = CURRICULUM[filiere]?.[annee]?.[semestre] || [];

    async function uploaderPdfCloudinary(file, onProgress) {
      return new Promise((resolve, reject) => {
        const url = "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/raw/upload";
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
        };
        xhr.onload = () => {
          try {
            const data = JSON.parse(xhr.responseText);
            if (xhr.status >= 200 && xhr.status < 300 && data.secure_url) {
              resolve(data.secure_url);
            } else {
              reject(new Error(data.error?.message || "Échec de l'envoi (code " + xhr.status + ")"));
            }
          } catch {
            reject(new Error("Réponse invalide de Cloudinary."));
          }
        };
        xhr.onerror = () => reject(new Error("Erreur réseau pendant l'envoi."));
        xhr.send(formData);
      });
    }

    function RecadreurImage({ file, onValider, onAnnuler }) {
      const [url, setUrl] = React.useState(null);
      const [natSize, setNatSize] = React.useState({ w: 0, h: 0 });

        e.preventDefault();
        e.stopPropagation();

        dragRef.current = { mode, startX: point.clientX, startY: point.clientY, startCrop: { ...crop } };

        window.addEventListener("mouseup", arreterGlisser);

        if (!dragRef.current || !dispSize.w) return;

        const point = e.touches ? e.touches[0] : e;
        const dxPct = ((point.clientX - dragRef.current.startX) / dispSize.w) * 100;
        const dyPct = ((point.clientY - dragRef.current.startY) / dispSize.h) * 100;
        const s = dragRef.current.startCrop;
        if (dragRef.current.mode === "move") {
          setCrop(c => ({ ...c, x: clamp(s.x + dxPct, 0, 100 - s.w), y: clamp(s.y + dyPct, 0, 100 - s.h) }));
        } else {
          setCrop(c => ({ ...c, w: clamp(s.w + dxPct, 15, 100 - s.x), h: clamp(s.h + dyPct, 15, 100 - s.y) }));
        }
      };

      const arreterGlisser = () => {
        dragRef.current = null;
        window.removeEventListener("mousemove", pendantGlisser);
        window.removeEventListener("mouseup", arreterGlisser);
        window.removeEventListener("touchmove", pendantGlisser);

    // Affiche un texte de corrigé (venant de l'IA ou saisi à la main) en le convertissant du
    // Markdown brut (**gras**, ### titres, $$formules$$...) vers un rendu lisible — sans ça,
    // les étudiants voient les symboles bruts et ne peuvent rien déchiffrer.
    function CorrigeRendu({ texte }) {
      const ref = React.useRef(null);
      useEffect(() => {
        if (!ref.current || !texte) return;

        // On protège d'abord les formules ($$...$$, \[...\], \(...\), $...$) AVANT de passer par
        // Markdown : sinon les soulignés (_) et astérisques à l'intérieur d'une formule LaTeX
        // (ex: u_{n+1}, x^{2}) sont interprétés comme de l'italique/gras par Markdown, ce qui casse
        // la syntaxe et fait apparaître le code brut au lieu de la formule rendue.
        const blocsMath = [];
        const texteProtege = texte.replace(
          /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^\n$]+?\$)/g,
          (match) => { blocsMath.push(match); return "@@MATHBLOCK" + (blocsMath.length - 1) + "@@"; }
        );

        let html = texteProtege;
        try {
          html = window.marked ? marked.parse(texteProtege, { breaks: true }) : texteProtege.replace(/\n/g, "<br>");

    // Ouvre une fenêtre avec un document HTML propre puis déclenche window.print() ;

    function imprimerPDF(titre, contenuHTML) {
      const fenetre = window.open("", "_blank");
      if (!fenetre) { alert("Autorise les pop-ups de ce site pour exporter en PDF."); return; }
      fenetre.document.write(
        "<html><head><title>" + titre + "</title><meta charset='utf-8'><style>" +
        "body{font-family:Georgia,serif;padding:32px;color:#1a1a1a;}" +
        "h1{font-size:20px;border-bottom:2px solid #f2ca50;padding-bottom:8px;margin-bottom:4px;}" +
        "p.meta{color:#555;font-size:12px;margin:2px 0;}" +
        "table{width:100%;border-collapse:collapse;margin-top:16px;}" +
        "th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd;font-size:13px;}" +
        "th{color:#888;text-transform:uppercase;font-size:10px;letter-spacing:0.05em;}" +
        "td.note{font-weight:bold;color:#B8860B;}" +
        "@media print{body{padding:16px;}}" +
        "</style></head><body>" + contenuHTML + "<script>window.onload=function(){setTimeout(function(){window.print();},300);}<\/script></body></html>"
      );
      fenetre.document.close();
      fenetre.focus();
    }

      const [notifsActivesState, setNotifsActivesState] = useState(notificationsActives);
      const handleToggleTheme = useCallback(() => {
        const nouveau = themeMode === "clair" ? "sombre" : "clair";
        appliquerTheme(nouveau);
        setThemeMode(nouveau); // force le re-rendu de tout l'arbre pour prendre en compte COLORS muté
      }, [themeMode]);
      // Un seul interrupteur pour l'utilisateur ("Notifications" dans le menu) pilote à la fois
      // les bulles internes (notifierBulle, actives dès que l'onglet est ouvert) et les pushs
      // FCM (reçus même app fermée) — plus simple à comprendre qu'avoir deux réglages séparés.
      const handleToggleNotifs = useCallback((actif) => {
        notificationsActives = actif;
        try { localStorage.setItem("sabi_notifs", actif ? "on" : "off"); } catch {}
        setNotifsActivesState(actif);
        if (!authUser) return;
        if (actif) {
          activerNotificationsPush(authUser.uid).then((res) => {
            if (!res.ok && res.raison === "refuse") {
              notifierBulle("Les notifications ont été bloquées dans les réglages du navigateur.", { titre: "Sabi", icone: "bell" });
            }
          });
        } else {
          desactiverNotificationsPush(authUser.uid);
        }
      }, [authUser]);
      // Pour les comptes déjà connectés où "Notifications" est resté sur ON par défaut (valeur
      // initiale) sans que l'utilisateur n'ait retouché l'interrupteur : on tente une activation
      // silencieuse une fois la session ouverte, plutôt que d'attendre qu'il bascule le toggle
      // off/on pour obtenir son premier token. Sans effet si la permission a déjà été tranchée
      // (déjà accordée -> token repris, déjà refusée -> le navigateur répond immédiatement sans re-prompt).
      useEffect(() => {
        if (authUser && notificationsActives) activerNotificationsPush(authUser.uid);
      }, [!!authUser]);
      const cards = useFirebaseList(cardsRef, { actif: !!authUser, onError: () => setConnexionOk(false) });
      const [myVotes, setMyVotes] = useState({});
      const boussoleSteps = useFirebaseList(boussoleRef, { actif: !!authUser });
      const [boussoleProgress, setBoussoleProgress] = useState({});
      const cartePoints = useFirebaseList(carteRef, { actif: !!authUser });
      const chatMessagesBrut = useFirebaseList(chatRef, { actif: !!authUser, limit: 100 });
      // Fil privé Assistance de l'étudiant connecté (support/{uid}) — non chargé pour le propriétaire,
      // qui utilise sa propre écoute complète dans SupportAdminTab.
      const supportMessages = useFirebaseList(authUser ? supportRef.child(authUser.uid) : null, { actif: !!authUser && !isOwner });
      const chatMessages = React.useMemo(() => [...chatMessagesBrut].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0)), [chatMessagesBrut]);
      const dernierMsgIdRef = React.useRef(null);
      const [epreuves, setEpreuves] = useState([]);
      const resumes = useFirebaseList(resumesRef, { actif: !!authUser });
      const pointsLogs = useFirebaseList(pointsLogRef, { actif: !!authUser, limit: 500 });
      const [badges, setBadges] = useState({});
      const [badgeActif, setBadgeActif] = useState(null);
      const [vip, setVip] = useState(false);
      const [abonnement, setAbonnement] = useState("free"); // "free" | "pro" | "proplus"
      const [isAdmin, setIsAdmin] = useState(false);
      const isAdminEffectif = isOwner || isAdmin;
      // Accès aux épreuves = admin/propriétaire OU abonnement pro/pro+ actif
      const accesEpreuves = isAdminEffectif || abonnement === "pro" || abonnement === "proplus";
      const [profilCharge, setProfilCharge] = useState(false);
      const bounties = useFirebaseList(bountyRef, { actif: !!authUser });
      const [promos, setPromos] = useState({});
      useEffect(() => {
        if (!authUser) { setPromos({}); return; }
        const listener = promosRef.on("value", snap => setPromos(snap.val() || {}));
        return () => promosRef.off("value", listener);
      }, [!!authUser]);
      const [membresList, setMembresList] = useState([]);
      const [profil, setProfilState] = useState({ annee: ANNEES[0], filiere: FILIERES[0] });
      const [pseudo, setPseudo] = useState("Étudiant_" + Math.floor(Math.random() * 9000 + 1000));

      // Bulle façon WhatsApp sur les nouveaux messages, uniquement quand on ne regarde pas déjà le chat
      useEffect(() => {
        if (chatMessages.length === 0) return;
        const dernier = chatMessages[chatMessages.length - 1];
        const estNouveau = dernierMsgIdRef.current !== null && dernier.id !== dernierMsgIdRef.current;
        const regardeLeChat = tab === "chat";
        if (estNouveau && dernier.pseudo !== pseudo && !regardeLeChat) {
          notifierBulle(dernier.texte, { titre: dernier.pseudo, icone: "message-circle" });
        }
        dernierMsgIdRef.current = dernier.id;
      }, [chatMessages, tab, pseudo]);
      const [whatsapp, setWhatsapp] = useState("");
      const [matricule, setMatriculeState] = useState("");
      const [points, setPoints] = useState(0);
      const pointsRef = React.useRef(0);
      const badgesRef = React.useRef({});
      const abonnementRef = React.useRef(null);
      const myscoreCountRef = React.useRef(null); // null tant qu'on n'a pas encore reçu l'état initial
      const profilChargeRef = React.useRef(false);
      const [pointsTotal, setPointsTotal] = useState(0);
      const [loading, setLoading] = useState(true);
      const [connexionOk, setConnexionOk] = useState(true);

      // Écoute l'état de connexion — redirige vers l'écran de connexion si pas connecté
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged(u => {
          setAuthUser(u);
          setAuthChecked(true);
        });
        return unsubscribe;
      }, []);

      // Connexion Firebase temps réel + chargement du profil (une fois connecté)
      useEffect(() => {
        if (!authUser) return;

        setMyVotes(loadMyVotes());
        setBoussoleProgress(loadBoussoleProgress());

        // Profil (pseudo, année, filière, points) — stocké sur le compte, synchronisé entre appareils
        const userRef = usersRef.child(authUser.uid);
        const userListener = userRef.on("value", snapshot => {
          const data = snapshot.val();
          if (data) {
            setPseudo(data.pseudo || "");
            setWhatsapp(data.whatsapp || "");
            setMatriculeState(data.matricule || "");
            setPoints(data.points || 0);
            setPointsTotal(data.pointsTotal || 0);
            setProfilState({ annee: data.annee || ANNEES[0], filiere: data.filiere || FILIERES[0] });
            setBadges(data.badges || {});
            setBadgeActif(data.badgeActif || null);
            setVip(!!data.vip);
            setIsAdmin(!!data.admin);
            setAbonnement(getAbonnementActif(data));
            setProfilCharge(true);

            // Bulles de notification sur les changements réels — jamais au tout premier
            // chargement (on ne veut pas "féliciter" quelqu'un pour son solde déjà existant).
            if (profilChargeRef.current) {
              const nouveauxPoints = data.points || 0;
              if (nouveauxPoints > pointsRef.current) {
                notifierBulle("+" + (nouveauxPoints - pointsRef.current) + " points gagnés !", { titre: "Sabi", icone: "award" });
              }
              const nouveauxBadges = data.badges || {};
              const badgeGagne = Object.keys(nouveauxBadges).find(id => nouveauxBadges[id] && !badgesRef.current[id]);
              if (badgeGagne) {
                const b = BADGES.find(x => x.id === badgeGagne);
                notifierBulle("Tu as débloqué le badge " + (b ? b.nom : badgeGagne) + " !", { titre: "Sabi", icone: "star" });
              }
              const nouvelAbo = getAbonnementActif(data);
              if (nouvelAbo && !abonnementRef.current) {
                notifierBulle("Ton abonnement " + (nouvelAbo === "proplus" ? "Sabi Pro+" : "Sabi Pro") + " est actif !", { titre: "Sabi", icone: "crown" });
              }
            }
            pointsRef.current = data.points || 0;
            badgesRef.current = data.badges || {};
            abonnementRef.current = getAbonnementActif(data);
            profilChargeRef.current = true;
          }
          setLoading(false);
        }, () => {
          setConnexionOk(false);
          setLoading(false);
        });

        // Bulle façon WhatsApp dès qu'une nouvelle note MyScore est publiée pour ce compte —
        // écoute globale (fonctionne même si l'étudiant n'a pas l'écran MyScore ouvert).
        const myscoreListener = myscoreRef.child(authUser.uid).on("value", snap => {
          const val = snap.val() || {};
          const entrees = Object.values(val);
          const officielles = entrees.filter(e => e.source !== "simulateur");
          if (myscoreCountRef.current !== null && officielles.length > myscoreCountRef.current) {
            // Notifie chaque nouvelle note individuellement (matière + note), le cas le plus
            // fréquent étant l'ajout d'une seule note à la fois.
            const nouvelles = entrees
              .filter(e => e.source !== "simulateur")
              .sort((a, b) => (b.publieLe || 0) - (a.publieLe || 0))
              .slice(0, officielles.length - myscoreCountRef.current);
            nouvelles.reverse().forEach(e => {
              notifierBulle((e.matiere || "Une matière") + " : " + e.note + "/20", { titre: "Nouvelle note MyScore", icone: "award" });
            });
          }
          myscoreCountRef.current = officielles.length;
        });

        // Vérifie si des cartes existent déjà, sinon initialise avec les cartes d'exemple (une seule fois)
        cardsRef.once("value").then(snapshot => {
          if (!snapshot.exists()) {
            cardsRef.set(SEED_CARDS);
          }
        });
        boussoleRef.once("value").then(snapshot => {
          if (!snapshot.exists()) {
            boussoleRef.set(SEED_BOUSSOLE);
          }
        });

        // cards / boussoleSteps / cartePoints / chatMessages / resumes / pointsLogs / bounties
        // sont désormais chargés directement via useFirebaseList (voir déclarations plus haut) —
        // plus besoin de gérer manuellement les listeners .on()/.off() pour ces 7 collections ici.

        return () => {
          userRef.off("value", userListener);
          myscoreRef.child(authUser.uid).off("value", myscoreListener);
        };
      }, [authUser]);

      // Épreuves — cloisonnées par année + filière (structure epreuves/$annee/$filiere/$id,
      // exactement ce qu'attendent les règles Firebase publiées).
      // - Propriétaire : aucune restriction, toutes années et toutes filières.
      // - Admin (non-propriétaire) : toutes les années, mais UNIQUEMENT sa propre filière.
      // - Compte Pro/Pro+ (non-admin) : uniquement sa propre année + sa propre filière.
      // - Compte gratuit : rien (paywall côté écran).
      useEffect(() => {
        if (!authUser || !profilCharge) return;
        if (!accesEpreuves) { setEpreuves([]); return; }

        if (isOwner) {
          const listenerOwner = epreuvesRef.on("value", snapshot => {
            const data = snapshot.val() || {};
            const list = [];
            Object.keys(data).forEach(annee => {
              if (data[annee] && data[annee].matiere) return; // reste d'ancien format non migré, ignoré
              Object.keys(data[annee] || {}).forEach(filiere => {
                if (typeof data[annee][filiere] !== "object") return;
                Object.keys(data[annee][filiere] || {}).forEach(id => {
                  list.push({ id, annee, filiere, ...data[annee][filiere][id] });
                });
              });
            });
            setEpreuves(list);
          }, err => console.error("Épreuves (propriétaire) :", err.message));
          return () => epreuvesRef.off("value", listenerOwner);
        } else if (isAdmin) {
          // Un listener par année, tous scopés sur la filière de l'admin — fusionnés en une seule liste.
          const parAnnee = {};
          let monte = true;
          const listeners = ANNEES.map(annee => {
            const ref = epreuvesRef.child(annee).child(profil.filiere);
            const cb = snapshot => {
              const data = snapshot.val() || {};
              parAnnee[annee] = Object.keys(data).map(id => ({ id, annee, filiere: profil.filiere, ...data[id] }));
              if (monte) setEpreuves(Object.keys(parAnnee).flatMap(a => parAnnee[a]));
            };
            ref.on("value", cb, err => console.error("Épreuves (admin) :", err.message));
            return { ref, cb };
          });
          return () => { monte = false; listeners.forEach(({ ref, cb }) => ref.off("value", cb)); };
        } else {
          const scopedRef = epreuvesRef.child(profil.annee).child(profil.filiere);
          const listenerEtudiant = scopedRef.on("value", snapshot => {
            const data = snapshot.val() || {};
            const list = Object.keys(data).map(id => ({ id, annee: profil.annee, filiere: profil.filiere, ...data[id] }));
            setEpreuves(list);
          }, err => console.error("Épreuves :", err.message));
          return () => scopedRef.off("value", listenerEtudiant);
        }
      }, [authUser, profilCharge, isOwner, isAdmin, accesEpreuves, profil.annee, profil.filiere]);

      // Toast léger pour les retours visuels immédiats (points gagnés, confirmations rapides...).
      // Un seul toast à la fois : un nouveau remplace l'ancien plutôt que de s'empiler.
      const [toast, setToast] = useState(null); // { message, leaving }
      const toastTimerRef = React.useRef(null);
      const showToast = useCallback((message) => {
        if (toastTimerRef.current) { clearTimeout(toastTimerRef.current.hide); clearTimeout(toastTimerRef.current.clear); }
        setToast({ message, leaving: false });
        const hide = setTimeout(() => setToast(t => t ? { ...t, leaving: true } : t), 1800);
        const clear = setTimeout(() => setToast(null), 2050);
        toastTimerRef.current = { hide, clear };
      }, []);

      // Ajoute des points sur le compte Firebase (transaction = jamais de conflit même avec plusieurs actions rapides)
      // + enregistre l'événement pour le classement hebdomadaire
      const addPoints = useCallback((n) => {
        if (!authUser) return;
        usersRef.child(authUser.uid).child("points").transaction(current => (current || 0) + n);
        usersRef.child(authUser.uid).child("pointsTotal").transaction(current => (current || 0) + n);
        pointsLogRef.push({ uid: authUser.uid, pseudo, filiere: profil.filiere, n, timestamp: Date.now() });
        if (n > 0) showToast("+" + n + " point" + (n > 1 ? "s" : "") + " ✨");
      }, [authUser, pseudo, profil.filiere, showToast]);

      // Bonus quotidien de 5 points — une fois par jour, à la connexion
      useEffect(() => {
        if (!authUser) return;
        const aujourdhui = new Date().toISOString().slice(0, 10);
        usersRef.child(authUser.uid).child("dernierBonus").once("value").then(snap => {
          if (snap.val() !== aujourdhui) {
            addPoints(5);
            usersRef.child(authUser.uid).child("dernierBonus").set(aujourdhui);
          }
        });
      }, [authUser]);

      // Annuaire public des membres — chargé seulement quand l'onglet "Membres" est ouvert,
      // visible par tous les utilisateurs (pas réservé au propriétaire)
      useEffect(() => {
        if (tab !== "membres" || !authUser) return;
        const listener = usersRef.on("value", snapshot => {
          const data = snapshot.val() || {};
          // Projection : whatsapp n'est inclus que pour owner/admin — pour tout le monde
          // d'autre, le champ n'atteint jamais le navigateur (pas juste caché à l'écran).
          setMembresList(Object.entries(data).map(([uid, u]) => ({
            uid,
            pseudo: u.pseudo,
            annee: u.annee,
            filiere: u.filiere,
            admin: !!u.admin,
            badgeActif: u.badgeActif,
            pointsTotal: u.pointsTotal,
            abonnement: u.abonnement,
            ...(isAdminEffectif ? { whatsapp: u.whatsapp } : {}),
          })));
        });
        return () => usersRef.off("value", listener);
      }, [tab, authUser, isAdminEffectif]);

      // Dépense sécurisée — la transaction vérifie le solde réel côté serveur avant de déduire,
      // impossible de se retrouver en négatif même avec des clics rapides.
      // Le propriétaire a des points illimités : aucune déduction, succès immédiat.
      const spendPoints = useCallback((cost, onSuccess) => {
        if (!authUser) return;
        if (isOwner) { onSuccess(); return; }
        usersRef.child(authUser.uid).child("points").transaction(current => {
          if ((current || 0) < cost) return; // abandonne la transaction si solde insuffisant
          return (current || 0) - cost;
        }).then(result => {
          if (result.committed) onSuccess();
        });
      }, [authUser, isOwner]);

      const handleVote = useCallback((id, direction) => {
        const current = loadMyVotes();
        const previous = current[id];
        if (previous === direction) return; // déjà voté dans ce sens, rien à faire

        // Sauvegarde locale privée du sens du vote
        const updatedVotes = { ...current, [id]: direction };
        saveMyVotes(updatedVotes);
        setMyVotes(updatedVotes);

        // Annule l'ancien vote s'il y en avait un, puis applique le nouveau
        if (previous) {
          const oldField = previous === "up" ? "up" : "down";
          cardsRef.child(id).child(oldField).transaction(c => Math.max(0, (c || 0) - 1));
        }
        const newField = direction === "up" ? "up" : "down";
        cardsRef.child(id).child(newField).transaction(c => (c || 0) + 1);

        if (!previous) addPoints(1); // points seulement pour un premier vote sur cette carte
      }, [addPoints]);

      // Réservé au propriétaire : supprime définitivement une carte du Fil
      const handleDeleteCard = useCallback((id) => {
        if (!isOwner) return;
        cardsRef.child(id).remove();
      }, [isOwner]);

      // Réservé au propriétaire : vide entièrement le Fil (Actualités) — utile pour
      // nettoyer les anciennes cartes de test.
      const handleClearAllCards = useCallback(() => {
        if (!isOwner) return;
        cardsRef.remove();
      }, [isOwner]);

      const handleContribute = useCallback(({ filiere, contenu, verifie, flash, imageUrl }) => {
        const newCardId = "c-" + Date.now();
        const publier = (flashJusqua) => {
          // auteurUid est exigé par la règle Firebase du nœud "cards" (elle vérifie que le
          // créateur d'une carte est bien l'utilisateur connecté) — son absence ici faisait
          // échouer TOUTE la publication avec "PERMISSION_DENIED", pas seulement ce champ.
          const newCard = { auteurUid: authUser.uid, filiere, contenu, verifie: !!verifie, auteur: pseudo, badge: badgeActif, up: 1, down: 0, date: new Date().toISOString().slice(0, 10) };
          if (imageUrl) newCard.imageUrl = imageUrl;
          if (flashJusqua) newCard.flashJusqua = flashJusqua;
          return cardsRef.child(newCardId).set(newCard).then(() => {
            const updatedVotes = { ...loadMyVotes(), [newCardId]: "up" };
            saveMyVotes(updatedVotes);
            setMyVotes(updatedVotes);
            addPoints(5);
          }).catch(err => {
            // Sans ce .catch, un échec d'écriture (règles Firebase, quota dépassé, coupure
            // réseau...) passait inaperçu : le message "Actualité publiée" s'affichait quand
            // même côté UI alors que rien n'était réellement enregistré en base. On prévient
            // maintenant clairement, ET on relance l'erreur pour que ContribuerTab sache que
            // la publication a échoué (et ne vide pas le formulaire, ni n'affiche "publiée").
            showToast("Échec de la publication : " + (err.message || "erreur inconnue"));
            throw err;
          });
        };
        if (flash) {
          return new Promise((resolve, reject) => {
            spendPoints(COUT_FLASH, () => { publier(Date.now() + DUREE_FLASH_MS).then(resolve, reject); });
          });
        }
        return publier(null);
      }, [pseudo, badgeActif, addPoints, spendPoints, showToast, authUser]);

      const handleToggleBoussole = useCallback((stepId) => {
        setBoussoleProgress(prev => {
          const updated = { ...prev, [stepId]: !prev[stepId] };
          saveBoussoleProgress(updated);
          return updated;
        });
      }, []);

      const handleAddBoussoleStep = useCallback(({ titre, categorie, description }) => {
        const stepId = "b-" + Date.now();
        const ordre = boussoleSteps.length + 1;
        boussoleRef.child(stepId).set({ titre, categorie, description, auteur: pseudo, ordre });
        addPoints(3);
      }, [pseudo, boussoleSteps, addPoints]);

      const handleAddCartePoint = useCallback(({ nom, categorie, description, lat, lng }) => {
        const pointId = "p-" + Date.now();
        carteRef.child(pointId).set({ nom, categorie, description, lat, lng, auteur: pseudo });
        addPoints(3);
      }, [pseudo, addPoints]);

      // Réservé au propriétaire : modifie un point existant de la carte du campus
      const handleUpdateCartePoint = useCallback((id, { nom, categorie, description, lat, lng }) => {
        if (!isOwner) return;
        carteRef.child(id).update({ nom, categorie, description, lat, lng });
      }, [isOwner]);

      // Réservé au propriétaire : supprime un point de la carte du campus
      const handleDeleteCartePoint = useCallback((id) => {
        if (!isOwner) return;
        carteRef.child(id).remove();
      }, [isOwner]);

      const handleSendMessage = useCallback((texte) => {
        const msgId = "m-" + Date.now();
        chatRef.child(msgId).set({ pseudo, texte, badge: badgeActif, timestamp: Date.now() });
        envoyerNotification({ diffusion: true, titre: pseudo + " (Chat Sabi)", corps: texte.slice(0, 120) });
      }, [pseudo, badgeActif]);

      // Assistance — l'étudiant envoie un message au propriétaire ; "lu: false" fait apparaître
      // le badge non-lu côté SupportAdminTab.
      const handleSendSupportMessage = useCallback(texte => {
        if (!authUser) return;
        supportRef.child(authUser.uid).push({ auteur: "etudiant", texte, timestamp: Date.now(), lu: false });
      }, [authUser]);

      // Marque comme lues les réponses du propriétaire une fois vues par l'étudiant.
      const handleMarkSupportLu = useCallback(msgIds => {
        if (!authUser) return;
        const updates = {};
        msgIds.forEach(id => { updates[id + "/lu"] = true; });
        supportRef.child(authUser.uid).update(updates);
      }, [authUser]);

      const setProfil = useCallback((newProfil) => {
        setProfilState(newProfil);
        if (authUser) usersRef.child(authUser.uid).update(newProfil);
      }, [authUser]);

      const handleAddEpreuve = useCallback(({ matiere, code, annee, anneeSujet, semestre, type, filiere, contenu, corrige, pdfUrl, imageUrl }) => {
        const epId = "e-" + Date.now();
        const data = { matiere, annee, semestre, type, filiere, contenu, corrige, auteur: pseudo, date: new Date().toISOString().slice(0, 10) };
        if (code) data.code = code;
        if (anneeSujet) data.anneeSujet = anneeSujet;
        if (pdfUrl) data.pdfUrl = pdfUrl;
        if (imageUrl) data.imageUrl = imageUrl;
        return epreuvesRef.child(annee).child(filiere).child(epId).set(data).then(() => {
          addPoints(15);
          envoyerNotification({ diffusion: true, titre: "Nouvelle épreuve — " + matiere, corps: pseudo + " a ajouté une épreuve pour " + filiere + " " + annee });
        });
      }, [pseudo, addPoints]);

      // Réservé aux admins/propriétaire : publie un résumé de cours (contenu Pro+)
      const handleAddResume = useCallback(({ matiere, annee, semestre, filiere, contenu, pdfUrl }) => {
        if (!isAdminEffectif) return Promise.reject(new Error("Accès non autorisé."));
        const id = "r-" + Date.now();
        const data = { matiere, annee, filiere, contenu, auteur: pseudo, date: new Date().toISOString().slice(0, 10) };
        if (semestre) data.semestre = semestre;
        if (pdfUrl) data.pdfUrl = pdfUrl;
        return resumesRef.child(id).set(data).then(() => {
          envoyerNotification({ diffusion: true, titre: "Nouveau résumé — " + matiere, corps: "Disponible pour " + filiere + " " + annee });
        });
      }, [pseudo, isAdminEffectif]);

      // Réservé au propriétaire : supprime définitivement un résumé
      const handleDeleteResume = useCallback((id) => {
        if (!isOwner) return;
        resumesRef.child(id).remove();
      }, [isOwner]);

      // Génère un résumé IA pour un résumé de cours et le met en cache dans Firebase

      const handleDemarrerPaiement = useCallback((tier, duree) => {

            method: "POST",
            headers: { "Authorization": NOTCHPAY_CLE_PUBLIQUE, "Content-Type": "application/json" },
            body: JSON.stringify({
              amount: effectif,
              currency: "XAF",
              email: (authUser && authUser.email) || "",
              reference: paiementId,
              description: "Sabi " + (tier === "proplus" ? "Pro+" : "Pro") + " — " + (duree || "semestre"),
              // NETLIFY_BASE_URL (pas window.location.origin) : dans l'app native, l'origine
              // vaut "https://localhost" qui n'existe pas sur Internet — NotchPay ne pourrait
              // jamais y rediriger l'utilisateur après paiement.
              callback: NETLIFY_BASE_URL + window.location.pathname + "?paiement=retour&ref=" + paiementId
            })
          })
        ).then(res => res.json().then(data => {
          if (!res.ok || !data.authorization_url) throw new Error((data && data.message) || "Échec de l'initialisation du paiement.");
          window.location.href = data.authorization_url;

      const [verifPaiementStatut, setVerifPaiementStatut] = useState(null); // null | "en_cours" | "ok" | "erreur"

        }).then(res => res.json()).then(data => {

      const handleDemandeChangementAnnee = useCallback((anneeDemandee) => {

      // Modification du mot de passe — nécessite une ré-authentification récente
      const handleUpdatePassword = useCallback((currentPassword, newPassword) => {

            .then(() => resolve())
            .catch(err => {

              else reject(new Error("Impossible de modifier le mot de passe. Réessaie."));

      const tabs = [
        { id: "actualites", label: "Actualités", icon: "radio" },
        { id: "epreuves", label: "Épreuves", icon: "book" },
        { id: "accueil", label: "Accueil", icon: "home" },
        { id: "carte", label: "Carte", icon: "map" },
        { id: "chat", label: "Chat", icon: "message-circle" },
      ];
      // Titres affichés dans le header à la place du logo — un par onglet, y compris les onglets
      // secondaires (accessibles depuis Profil) qui ne sont pas dans la barre de nav du bas.
      const TITRES_ONGLETS = {
        actualites: "Actualités", epreuves: "Épreuves", accueil: "Accueil", carte: "Carte", chat: "Chat",
        boussole: "Boussole", classement: "Classement", boutique: "Boutique & Bounty", simulateur: "Simulateur de moyenne",
        mentor: "Coach Réussite", membres: "Membres", admin: "Administration", resumes: "Résumés de cours",
        myscore: "MyScore", assistance: "Assistance", supportAdmin: "Messagerie Assistance", contribuer: "Publier",
        infosperso: "Mes informations",
      };
      // Navigation par glissement (swipe) horizontal entre les 5 onglets principaux, dans l'ordre
      // où ils apparaissent dans la barre du bas : actualités ↔ épreuves ↔ accueil ↔ carte ↔ chat.
      // La carte est exclue en tant que point de DÉPART du glissé (elle a son propre glissé Leaflet
      // pour se déplacer sur le plan) — mais on peut quand même y arriver depuis "épreuves" ou "chat".
      //
      // Le contenu suit le doigt en direct (translateX appliqué directement sur le DOM via ref,
      // sans passer par setState à chaque pixel — indispensable pour rester fluide sur un fichier
      // aussi volumineux). Au relâchement : au-delà du seuil, on termine la sortie puis on bascule
      // d'onglet (qui rejoue l'animation d'entrée existante) ; en dessous du seuil, le contenu
      // revient à sa place avec un petit ressort.
      //
      // Sur les écrans secondaires (profil, boussole, boutique, etc.), un balayage démarré près du
      // bord gauche et tiré vers la droite déclenche le même retour que le bouton "← Retour" — geste
      // de retour façon Android/iOS, en plus du bouton (qui reste affiché).
      const SWIPE_TABS = ["actualites", "epreuves", "accueil", "carte", "chat"];
      const LARGEUR_BORD_RETOUR = 28; // px depuis le bord gauche pour déclencher le balayage retour
      const swipeContentRef = React.useRef(null);
      const swipeStartRef = React.useRef(null);
      const [swipeAnim, setSwipeAnim] = useState(null); // "left" | "right" | null — sens d'entrée de l'onglet

      const appliquerTransform = (dx, avecTransition) => {
        const el = swipeContentRef.current;
        if (!el) return;
        el.style.transition = avecTransition ? "transform 180ms cubic-bezier(0.22, 0.61, 0.36, 1)" : "none";
        el.style.transform = "translateX(" + dx + "px)";
      };

      const onSwipeTouchStart = e => {
        const t = e.touches[0];
        swipeStartRef.current = {
          x: t.clientX,
          y: t.clientY,
          horizontal: null, // décidé au premier mouvement net (évite de bloquer un scroll vertical)
          peutGlisserTab: tab !== "carte" && SWIPE_TABS.includes(tab),
          peutRetourBord: (afficherRetour || estProfil) && t.clientX <= LARGEUR_BORD_RETOUR,
        };
        appliquerTransform(0, false);
      };

      const onSwipeTouchMove = e => {
        const start = swipeStartRef.current;
        if (!start || (!start.peutGlisserTab && !start.peutRetourBord)) return;
        const t = e.touches[0];
        const dx = t.clientX - start.x;
        const dy = t.clientY - start.y;
        if (start.horizontal === null) {
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // pas encore assez de mouvement pour trancher
          start.horizontal = Math.abs(dx) > Math.abs(dy) * 1.3;
        }
        if (!start.horizontal) return;
        e.preventDefault(); // empêche le scroll vertical de "voler" le geste une fois l'horizontal confirmé

        const idx = SWIPE_TABS.indexOf(tab);
        const limiteGauche = start.peutRetourBord || (start.peutGlisserTab && idx > 0);
        const limiteDroite = start.peutGlisserTab && idx < SWIPE_TABS.length - 1;
        // Petite résistance ("rubber-band") si on pousse vers un côté sans destination.
        let dxAffiche = dx;
        if (dx > 0 && !limiteGauche) dxAffiche = dx * 0.25;
        if (dx < 0 && !limiteDroite) dxAffiche = dx * 0.25;
        appliquerTransform(dxAffiche, false);
      };

      const onSwipeTouchEnd = e => {
        const start = swipeStartRef.current;
        swipeStartRef.current = null;
        if (!start || !start.horizontal) { appliquerTransform(0, false); return; }
        const t = e.changedTouches[0];
        const dx = t.clientX - start.x;
        const SEUIL = 70;
        const idx = SWIPE_TABS.indexOf(tab);
        const largeur = (swipeContentRef.current && swipeContentRef.current.offsetWidth) || 360;

        // Balayage retour (bord gauche → droite) sur un écran secondaire.
        if (start.peutRetourBord && dx > SEUIL) {
          appliquerTransform(largeur, true);
          setTimeout(() => { setSwipeAnim("right"); setTab(estProfil ? tabAvantProfil : retourVers); appliquerTransform(0, false); }, 180);
          return;
        }
        // Glissement entre les 4 onglets principaux.
        if (start.peutGlisserTab && dx < -SEUIL && idx < SWIPE_TABS.length - 1) {
          appliquerTransform(-largeur, true);
          setTimeout(() => { setSwipeAnim("left"); setTab(SWIPE_TABS[idx + 1]); appliquerTransform(0, false); }, 180);
          return;
        }
        if (start.peutGlisserTab && dx > SEUIL && idx > 0) {
          appliquerTransform(largeur, true);
          setTimeout(() => { setSwipeAnim("right"); setTab(SWIPE_TABS[idx - 1]); appliquerTransform(0, false); }, 180);
          return;
        }
        // Sous le seuil : petit ressort de retour à zéro.
        appliquerTransform(0, true);
      };
      // touchmove attaché en natif (pas via la prop React onTouchMove) : React rend ses écouteurs
      // tactiles passifs par défaut, ce qui empêche preventDefault() de fonctionner et laisserait
      // le scroll vertical du navigateur "voler" le geste horizontal. Réattaché à chaque changement
      // d'onglet car le conteneur (key: tab) est un tout nouveau nœud DOM à chaque fois.
      useEffect(() => {
        const el = swipeContentRef.current;
        if (!el) return;
        el.addEventListener("touchmove", onSwipeTouchMove, { passive: false });
        return () => el.removeEventListener("touchmove", onSwipeTouchMove);
      }, [tab]);
      const secondaryIds = ["boussole", "classement", "boutique", "simulateur", "mentor", "membres", "admin", "myscoreAdmin", "promoAdmin", "resumes", "myscore", "assistance", "supportAdmin", "infosperso"];
      const activeBottom = tabs.some(t => t.id === tab) ? tab : null;
      const afficherRetour = secondaryIds.includes(tab) || tab === "contribuer";
      // Total des demandes en attente (changement d'année/filière/matricule, VIP, abonnement) —
      // sert uniquement à afficher une pastille sur "Administration" dans le menu Profil, pour
      // que le propriétaire sache d'un coup d'œil qu'il y a des choses à traiter. N'est chargé
      // que pour le propriétaire (actif: isOwner) : aucun coût pour les autres utilisateurs.
      const demandesAnneeCount = useFirebaseList(demandesAnneeRef, { actif: isOwner }).length;
      const demandesFiliereCount = useFirebaseList(demandesFiliereRef, { actif: isOwner }).length;
      const demandesMatriculeCount = useFirebaseList(demandesMatriculeRef, { actif: isOwner }).length;
      const vipDemandesCount = useFirebaseList(vipDemandesRef, { actif: isOwner }).length;
      const abonnementDemandesCount = useFirebaseList(abonnementDemandesRef, { actif: isOwner }).length;
      const demandesEnAttente = demandesAnneeCount + demandesFiliereCount + demandesMatriculeCount + vipDemandesCount + abonnementDemandesCount;
      // Notifications personnelles non lues — pour tout le monde cette fois (pas seulement le
      // propriétaire) : c'est ce qui allume la pastille sur l'icône profil du header. Le compte
      // "demandesEnAttente" ci-dessus reste, lui, réservé au badge du menu Administration.

      }, [tab, authUser, notifsNonLues]);

                style: { color: COLORS.textMuted }
              }, React.createElement(Icon, { name: "arrow-left", size: 14 }), " Retour")
            : React.createElement(React.Fragment, null,

                },

                    React.createElement("div", { className: "flex items-center gap-2" },
                      React.createElement("button", {

                        "aria-label": "Ouvrir le menu"
                      }, React.createElement(Icon, { name: "menu", size: 18, color: COLORS.textMuted })),
                      React.createElement("p", { className: "text-base font-semibold truncate", style: { color: COLORS.text } }, TITRES_ONGLETS[tab] || "Sabi")
                    ),
                    React.createElement("button", {
                      onClick: () => { setTabAvantProfil(tab); setTab("profil"); },
                      className: "w-9 h-9 flex-shrink-0 flex items-center justify-center rounded-full relative",
                      style: { backgroundColor: "transparent", border: `1px solid ${COLORS.border}` },
                      "aria-label": "Profil"
                    },

                      })
                    )

              ),

            className: "flex-1 min-h-0 " +
              (SWIPE_TABS.includes(tab) && swipeAnim ? (swipeAnim === "left" ? "sabi-swipe-in-left" : "sabi-swipe-in-right") : "sabi-tab-fade") + " " +
              (tab === "carte"
                ? "relative overflow-hidden"
                : "px-5 pt-4 " + (tab === "chat"
                    ? "overflow-hidden flex flex-col pb-3"
                    : "overflow-y-auto " + (tab === "accueil" || tab === "actualites" ? "pb-28" : "pb-8")))
          },
            !connexionOk && React.createElement("div", {
              className: "flex items-center gap-2 text-xs font-mono px-3 py-2 rounded-lg mb-3",
              style: { backgroundColor: COLORS.border, color: COLORS.textMuted }
            },
              React.createElement(Icon, { name: "wifi-off", size: 13 }),

            ),

              ? React.createElement("div", { className: "flex flex-col gap-3 pt-2" },

                )
              : (TAB_RENDERERS[tab] || TAB_RENDERERS.simulateur)()
          ),
          // Toast de retour rapide (points gagnés, confirmations) — ancré en haut, sous le header.
          toast && React.createElement("div", {
            className: "sabi-toast" + (toast.leaving ? " sabi-toast-leaving" : "") + " fixed left-1/2 z-[1200] px-4 py-2 rounded-full text-sm font-semibold shadow-lg",
            style: { top: 76, backgroundColor: COLORS.gold, color: COLORS.bg }
          }, toast.message),

          // FAB ouvert à tous (la contribution n'est plus réservée à owner/admin) —
          // accès rapide à "Publier", visible uniquement sur l'onglet Actualités.
          !loading && connexionOk && tab === "actualites" && React.createElement("button", {
            onClick: () => setTab("contribuer"),
            className: "sabi-fab absolute right-5 w-14 h-14 flex items-center justify-center text-2xl z-10",
            style: { color: COLORS.bg, bottom: 96 },
            "aria-label": "Publier une actualité"
          }, React.createElement(Icon, { name: "edit-2", size: 22 })),

          // Masquée sur l'écran Profil, qui n'a pas de nav (voir bouton retour ci-dessus).
          !estProfil && React.createElement("div", { className: "sabi-nav flex border-t", style: { borderColor: COLORS.border, backgroundColor: COLORS.bg } },
            tabs.map(t => {

                React.createElement("div", {

                },
