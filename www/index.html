  <script>
    // Enregistre le service worker (PWA) — silencieux en cas d'échec, l'app reste
    // utilisable normalement même si le navigateur ne le supporte pas.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then((reg) => {
          // Background Sync : redéclenché à chaque retour réseau (best-effort, voir sw.js).
          if ("sync" in reg) {
            window.addEventListener("online", () => reg.sync.register("sabi-sync").catch(() => {}));
          }
          // Periodic Background Sync : nécessite en plus une permission explicite, accordée par
          // Chrome seulement pour une PWA installée avec un usage régulier (jamais garanti).
          if ("periodicSync" in reg) {
            navigator.permissions.query({ name: "periodic-background-sync" }).then((status) => {
              if (status.state === "granted") {
                reg.periodicSync.register("sabi-rappels-epreuves", { minInterval: 12 * 60 * 60 * 1000 }).catch(() => {});
              }
            }).catch(() => {});
          }
        }).catch(() => {});
      });
    }
  </script>

  <!-- ===== Protection anti-capture / anti-fuite (best-effort) =====
       Une vraie capture d'écran (touche du téléphone/PC) ne peut techniquement
       pas être bloquée ni détectée par un site web, quel qu'il soit. Ce bloc fait
       deux choses réalistes : (1) noircit l'écran dès que l'app perd le focus,
       ce qui bloque la plupart des logiciels d'enregistrement d'écran et les
       captures via changement d'onglet/app ; (2) appose un filigrane discret
       avec l'identité de l'étudiant connecté, pour dissuader et tracer une
       fuite si une capture "physique" (photo d'écran) échappe malgré tout. -->
  <style>
    #sabi-shield {
      position: fixed; inset: 0; z-index: 999999;
      background: #000; opacity: 0; pointer-events: none;
    }
    #sabi-shield.actif { opacity: 1; pointer-events: auto; }
    #sabi-watermark {
      position: fixed; inset: 0; z-index: 999998; pointer-events: none;
      overflow: hidden; opacity: 0.05;
    }
    #sabi-watermark span {
      position: absolute; white-space: nowrap; color: #000;
      font-size: 12px; font-weight: 700; transform: rotate(-30deg);
    }
  </style>
  <div id="sabi-shield"></div>
  <div id="sabi-watermark"></div>
  <script>
    (function () {
      var shield = document.getElementById("sabi-shield");
      function activer() { shield.classList.add("actif"); }
      function desactiver() { shield.classList.remove("actif"); }
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) activer(); else desactiver();
      });
      window.addEventListener("blur", activer);
      window.addEventListener("focus", desactiver);

      // Limite la copie facile (n'empêche pas une capture physique de l'écran).
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("dragstart", function (e) { e.preventDefault(); });

      // Filigrane traçable : identité de l'étudiant connecté (email Firebase Auth),
      // répétée en discret sur les onglets Épreuves et Résumés (contenu sensible aux
      // fuites : sujets, corrigés, résumés de cours). Reste permanent mais léger — pas
      // de mode "saturé" : impossible de détecter une capture d'écran physique depuis
      // un site web, donc pas de sens à réserver l'effet à ce moment précis (voir
      // discussion). Invisible sur les autres onglets.
      function poserFiligrane(texte) {
        var wm = document.getElementById("sabi-watermark");
        if (!wm) return;
        texte = texte || window.__sabiFiligraneTexte || "Sabi";
        var onglet = window.__sabiTabActif;
        var actif = onglet === "epreuves" || onglet === "resumes";
        wm.style.opacity = actif ? "0.05" : "0";
        if (!actif) { wm.innerHTML = ""; return; }
        var html = "";
        for (var y = 0; y < 10; y++) {
          for (var x = 0; x < 5; x++) {
            html += '<span style="top:' + (y * 130) + 'px; left:' + (x * 240 - 80) + 'px;">' + texte + "</span>";
          }
        }
        wm.innerHTML = html;
      }
      poserFiligrane();
      window.__sabiActualiserFiligrane = poserFiligrane;
      window.addEventListener("resize", function () { poserFiligrane(window.__sabiFiligraneTexte); });

      // Se raccroche à Firebase Auth (déjà initialisé plus haut dans la page)
      // pour afficher l'email de l'étudiant connecté dans le filigrane.
      function connecterAuFirebaseAuth() {
        if (window.firebase && firebase.apps && firebase.apps.length && firebase.auth) {
          firebase.auth().onAuthStateChanged(function (user) {
            var texte = (user && (user.email || user.uid)) || "Sabi";
            window.__sabiFiligraneTexte = texte;
            poserFiligrane(texte);
          });
        } else {
          setTimeout(connecterAuFirebaseAuth, 500);
        }
      }
      connecterAuFirebaseAuth();
    })();
  </script>
