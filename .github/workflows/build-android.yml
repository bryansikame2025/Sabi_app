name: Build APK Android (avec blocage des captures d'ecran)

on:
  workflow_dispatch:
    inputs:
      pour_captures_ecran:
        description: "Compiler SANS le blocage de capture (uniquement pour prendre les screenshots Play Store — ne jamais publier cette version)"
        type: boolean
        default: false
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dependances
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Generer l'icone de l'app (fond sombre + "S" dore, ou icon-source.png si present)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          pip install pillow -q
          python3 scripts/generate_icon.py

      - name: Synchroniser le contenu web (www/) vers l'app Android
        run: npx cap sync android

      - name: Generer l'ecran de demarrage (logo Sabi centre sur fond sombre)
        run: python3 scripts/generate_splash.py

      - name: Choisir la version de MainActivity (protegee, ou sans protection pour captures Play Store)
        run: |
          DEST="android/app/src/main/java/com/sabi/app/MainActivity.java"
          mkdir -p "$(dirname "$DEST")"
          if [ "${{ github.event.inputs.pour_captures_ecran }}" = "true" ]; then
            echo "::warning::Build SANS FLAG_SECURE — pour captures Play Store uniquement, a ne pas publier."
            cp android-template/MainActivity-captures-ecran.java "$DEST"
          else
            cp android-template/MainActivity.java "$DEST"
          fi

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler l'APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Publier l'APK compile
        uses: actions/upload-artifact@v4
        with:
          name: sabi-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

